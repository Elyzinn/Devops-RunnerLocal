name: Deploy automático na VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Subir/atualizar containers
        run: docker compose up -d --build

      - name: Limpar imagens antigas
        run: docker image prune -f
