services:

  app-php:
    build:
      context: ./src/php
      dockerfile: Dockerfile
    container_name: app-php
    ports:
      - "8080:80"

    environment:
      DB_HOST: database
      DB_USER: sudosu
      DB_PASSWORD: simplicidade2
      DB_NAME: crudPrateleira

    volumes:
      - ./src:/var/www/html

    depends_on:
      database:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

    networks:
      - local_network

  database:
    image: postgres:15.3-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_DB: crudPrateleira
      # automaticamente cria uma banco com este nome
      # tirando a necessidade de ter o USE crudPrateleira no db.sql
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testepost
    ports:
      - 5440:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
      
    networks:
      - local_network

volumes:
  postgres_data:

networks:
  local_network:
    driver: bridge
